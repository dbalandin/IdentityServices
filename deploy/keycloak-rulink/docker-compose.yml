keycloak:
   image: keycloak-rulink:26.7.5
   container_name: keycloak-rulink
   command: start
   ports:
     - "127.0.0.1:10020:8080"
   environment:
     KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
     KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
     KC_DB: postgres
     KC_DB_URL_HOST: ${KC_DB_URL_HOST}
     KC_DB_URL_PORT: "15194"
     KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
     KC_DB_USERNAME: ${KC_DB_USERNAME}
     KC_DB_PASSWORD: ${KC_DB_PASSWORD}
     KC_HTTP_ENABLED: "true"
     KC_HOSTNAME: idp.rulink.io
     KC_PROXY_HEADERS: xforwarded
     KC_HEALTH_ENABLED: "true"
     INIT_DEMO_PASSWORD: ${INIT_DEMO_PASSWORD}
     PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
     DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET}
     PORTAL_REDIRECT_URIS: http://127.0.0.1:10030/*
     PORTAL_WEB_ORIGINS: http://127.0.0.1:10030
     DEMO_API_REDIRECT_URIS: ${DEMO_API_REDIRECT_URIS}
     DEMO_API_WEB_ORIGINS: ${DEMO_API_WEB_ORIGINS}
     SMTP_HOST: ${SMTP_HOST}
     SMTP_PORT: "465"
     SMTP_USER: ${SMTP_USER}
     SMTP_PASSWORD: ${SMTP_PASSWORD}
     SMTP_FROM: ${SMTP_FROM}
     SMTP_STARTTLS: "true"
   volumes:
     - /opt/services/keycloak-rulink/init:/keycloak-init:ro
   healthcheck:
     test:
       - CMD
       - bash
       - -c
       # healthcheck без /dev/tcp (net-redirections не везде доступны) и без curl (нет в образе):
       # порт 9000 = 0x2328 в состоянии 0A (LISTEN) в /proc/net/tcp или /proc/net/tcp6
       # (quarkus management-интерфейс может слушать только IPv6 — проверяем оба файла)
       - "grep -q :2328.*:0000.0A /proc/net/tcp /proc/net/tcp6"
     interval: 15s
     timeout: 5s
     retries: 20
     start_period: 90s
   restart: unless-stopped