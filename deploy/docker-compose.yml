keycloak:
   image: keycloak-rulink:26.7.5
   container_name: keycloak-rulink
   command: start
   ports:
     - "127.0.0.1:10020:8080"
   environment:
     KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
     KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
     KC_DB: postgres
     KC_DB_URL_HOST: ${KC_DB_URL_HOST}
     KC_DB_URL_PORT: "15194"
     KC_DB_URL_DATABASE: ${KC_DB_URL_DATABASE}
     KC_DB_USERNAME: ${KC_DB_USERNAME}
     KC_DB_PASSWORD: ${KC_DB_PASSWORD}
     KC_HTTP_ENABLED: "true"
     KC_HOSTNAME: idp.rulink.io
     KC_PROXY_HEADERS: xforwarded
     KC_HEALTH_ENABLED: "true"
     INIT_DEMO_PASSWORD: ${INIT_DEMO_PASSWORD}
     PORTAL_CLIENT_SECRET: ${PORTAL_CLIENT_SECRET}
     DEMO_CLIENT_SECRET: ${DEMO_CLIENT_SECRET}
     PORTAL_REDIRECT_URIS: http://127.0.0.1:10030/*
     PORTAL_WEB_ORIGINS: http://127.0.0.1:10030
     DEMO_API_REDIRECT_URIS: ""
     DEMO_API_WEB_ORIGINS: ""
     SMTP_HOST: ${SMTP_HOST}
     SMTP_PORT: "465"
     SMTP_USER: ${SMTP_USER}
     SMTP_PASSWORD: ${SMTP_PASSWORD}
     SMTP_FROM: ${SMTP_FROM}
     SMTP_STARTTLS: "true"
   volumes:
     - /opt/services/keycloak/init:/keycloak-init:ro
   healthcheck:
     test:
       - CMD
       - bash
       - -c
       - 'exec 3<>/dev/tcp/127.0.0.1:9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -qE "\"status\": ?\"UP\"" <&3'
     interval: 15s
     timeout: 5s
     retries: 20
     start_period: 90s
   restart: unless-stopped